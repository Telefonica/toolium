name: release

on:
  push:
    branches:
      - master

permissions:
  contents: read

# Only one release at a time, and never cancel one in progress: cancelling while
# semantic-release is pushing its version commit would leave the repository inconsistent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and tag
    # A commit message containing [skip release] postpones the release: the workflow is
    # skipped, and the commits it carries (including feat: and fix: ones) stay pending, so
    # the next release includes them. It only affects this workflow, not CI.
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to push the version commit and the tag
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
    - name: Checkout master
      uses: actions/checkout@v6
      with:
        ref: ${{ github.ref_name }}  # always the tip of master, not the triggering SHA
        fetch-depth: 0               # semantic-release needs the full history and tags
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Force the branch to the current commit
      run: git reset --hard "$GITHUB_SHA"
    - name: Set up python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Calculate version, update changelog, commit and tag
      id: release
      uses: python-semantic-release/python-semantic-release@v10
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        git_committer_name: 'github-actions'
        git_committer_email: 'actions@users.noreply.github.com'
        # This action runs in its own Docker container, which does not include the `build`
        # package, so its build_command would fail with "No module named build". The build
        # is done in a later step on the runner instead, where it is installed.
        build: 'false'
    - name: Build sdist and wheel
      if: steps.release.outputs.released == 'true'
      run: python -m build
    - name: Check distribution metadata
      if: steps.release.outputs.released == 'true'
      run: twine check dist/*
    - name: Upload distribution
      if: steps.release.outputs.released == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    name: Publish on PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/toolium
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
    - name: Download distribution
      uses: actions/download-artifact@v5
      with:
        name: dist
        path: dist/
    - name: Publish distribution on PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish GitHub release
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create the release and attach the assets
    steps:
    - name: Download distribution
      uses: actions/download-artifact@v5
      with:
        name: dist
        path: dist/
    - name: Upload the distribution to the GitHub release
      uses: python-semantic-release/publish-action@v10
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ needs.release.outputs.tag }}